<section class="page">
  <h1>¿A dónde vamos hoy?</h1>
  <p class="lead">Programa tus viajes compartidos con conductores verificados.</p>

  <div class="grid">
    @for (item of links; track item.link) {
      <a [routerLink]="item.link" class="link-card">
        <mat-card appearance="outlined">
          <mat-card-header>
            <mat-icon matCardAvatar aria-hidden="true">{{ item.icon }}</mat-icon>
            <mat-card-title>{{ item.title }}</mat-card-title>
            <mat-card-subtitle>{{ item.description }}</mat-card-subtitle>
          </mat-card-header>
        </mat-card>
      </a>
    }
  </div>
</section>
