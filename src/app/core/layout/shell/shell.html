<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidebar"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
    aria-label="Menú principal"
  >
    <div class="sidebar-inner">
      <a [routerLink]="homeUrl()" class="brand" (click)="isHandset() && drawer.close()">
        <app-brand-logo [size]="44" inverted />
        <span class="brand-text">
          <span class="brand-name">ShareWay</span>
          <span class="brand-role">{{ roleLabel() }}</span>
        </span>
      </a>

      <nav class="nav">
        @for (item of navItems(); track item.link) {
          <a
            class="nav-item"
            [routerLink]="item.link"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{exact: item.exact ?? false}"
            (click)="isHandset() && drawer.close()"
          >
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="user">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user-text">
          <span class="user-name" data-testid="user-name">{{ displayName() }}</span>
          <span class="user-role">{{ roleLabel() }}</span>
        </span>
        <button
          mat-icon-button
          type="button"
          class="logout"
          aria-label="Cerrar sesión"
          matTooltip="Cerrar sesión"
          (click)="logout()"
        >
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <header class="topbar" [class.mobile]="isHandset()">
      @if (isHandset()) {
        @if (isHome()) {
          <button mat-icon-button type="button" aria-label="Abrir menú" (click)="drawer.open()">
            <mat-icon>menu</mat-icon>
          </button>
        } @else {
          <button mat-icon-button type="button" aria-label="Volver" (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
          </button>
        }
      }
      <span class="topbar-title">{{ pageTitle() }}</span>
      @if (isHandset() && !isHome()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="drawer.open()">
          <mat-icon>menu</mat-icon>
        </button>
      }
    </header>
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
