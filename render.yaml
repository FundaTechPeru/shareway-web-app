# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: shareway-web-app
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/shareway-web-app/browser
    envVars:
      - key: NODE_VERSION
        value: '24'
    routes:
      # Let Angular's router handle every path (client-side routing).
      - type: rewrite
        source: /*
        destination: /index.html
